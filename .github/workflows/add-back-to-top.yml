name: Add back to top button

on:
  push:
    paths:
      - '.github/workflows/add-back-to-top.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App Detailing preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app-detailing-preview/index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="backToTop"' not in s:
              css = '.back-to-top{position:fixed;right:24px;bottom:24px;z-index:80;width:54px;height:54px;border:0;border-radius:18px;background:#0e1013;color:#fff;display:grid;place-items:center;font-size:26px;font-weight:900;box-shadow:0 14px 38px #0e101338;cursor:pointer;opacity:0;visibility:hidden;transform:translateY(12px);transition:.2s ease}.back-to-top.show{opacity:1;visibility:visible;transform:translateY(0)}.back-to-top:hover{background:#2248ff;transform:translateY(-2px)}@media(max-width:640px){.back-to-top{right:14px;bottom:14px;width:50px;height:50px;border-radius:16px}}'
              s = s.replace('</style>', css + '</style>', 1)
              widget = '<button class="back-to-top" id="backToTop" type="button" aria-label="Наверх" title="Наверх">↑</button><script>const backToTop=document.getElementById("backToTop");const toggleBackToTop=()=>backToTop.classList.toggle("show",window.scrollY>500);window.addEventListener("scroll",toggleBackToTop,{passive:true});toggleBackToTop();backToTop.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));</script>'
              s = s.replace('</body>', widget + '</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-detailing-preview/index.html
          git commit -m 'Add floating back to top button [skip ci]'
          git push
